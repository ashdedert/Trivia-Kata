<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ashlyn Dedert - Kata</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <header>
            <h1>TRIVIA</h1>
        </header>

        <div id="quiz-container">
            <div id="startForm">
                <h2>Select Category</h2>
                <select id="category"></select>

                <br>

                <h2>Select Difficulty</h2>
                <select id="difficulty">
                    <option value="">Any Difficulty</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <br>

                <h2>Choose Number of Questions</h2>
                <div id="question-buttons">
                <button id="button5" onclick="selectNumQuestions(5)" class="selected">5</button>
                <button id="button10" onclick="selectNumQuestions(10)">10</button>
                </div>

                <label>
                    <input type="checkbox" id="enableTimer" checked>
                    Enable Timer
                </label>
                
                <label>
                    <input type="checkbox" id="enableHints" checked>
                    Enable Hints
                </label>

                <br>

                <button id="startButton" onclick="startQuiz()" disabled>Start Quiz</button>
            </div>
                <div id="quiz">
                <div id="timer"></div>
                <h2 id="question"></h2>
                <div id="answers"></div>
                <div id="feedback"></div>
                <button id="hintButton" onclick="useHint()" hidden="true">50/50 Hint</button>
            </div>
        </div>
        
        <footer>
            <p>@2026 Ashlyn Dedert</p>
            <p>Questions from Open Source Trivia: https://opentdb.com</p>
        </footer>
        <script src="script.js"></script>
    </body>

</html>
